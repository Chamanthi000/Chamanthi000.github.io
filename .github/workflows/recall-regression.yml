name: Recall regression checks
on:
  push:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  pull_request:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test progress, reminders, storage, and accessibility
        run: node --test leetcode-revision/tests/recall.test.mjs
      - name: Validate Strings Python examples and interview templates
        run: python3 leetcode-revision/tests/strings-guide-validation.py
      - name: Validate all DSA guides, algorithms and static bundle
        working-directory: leetcode-revision
        run: |
          python3 scripts/build-dsa-guides.py --check
          python3 -m unittest discover -s tests -p "test_*.py" -v
          for topic in hash-maps linked-lists stacks queues trees heaps graphs tries union-find; do
            python3 "$topic-template-tests.py"
          done
          node tests/dsa-renderer.test.cjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test iPhone, iPad and desktop plus local save and reload
        run: node leetcode-revision/tests/browser-smoke.mjs
      - name: Test all DSA guide controls, private notes and mobile content
        working-directory: leetcode-revision
        run: |
          node tests/dsa-browser.test.cjs
          node tests/dsa-real-content.test.cjs
