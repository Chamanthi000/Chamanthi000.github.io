name: Recall regression checks
on:
  push:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  pull_request:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test progress, reminders, storage, and accessibility
        run: node --test leetcode-revision/tests/recall.test.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test iPhone, iPad and desktop plus local save and reload
        run: node leetcode-revision/tests/browser-smoke.mjs
