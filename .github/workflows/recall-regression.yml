name: Recall regression checks
on:
  push:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  pull_request:
    paths:
      - "leetcode-revision/**"
      - ".github/workflows/recall-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test progress, reminders, storage, and accessibility
        run: node --test leetcode-revision/tests/recall.test.mjs
      - name: Validate Arrays fallback Python examples and interview templates
        run: python3 leetcode-revision/tests/arrays-guide-validation.py
      - name: Validate Strings Python examples and interview templates
        run: python3 leetcode-revision/tests/strings-guide-validation.py
      - name: Test private sync, conflicts, recovery and automatic backups with synthetic adapters
        run: node --test leetcode-revision/tests/data-safety-*.test.mjs leetcode-revision/tests/recovery-ui.test.mjs
      - name: Check all DSA content schemas and deterministic generated assets
        run: |
          python3 leetcode-revision/scripts/build-dsa-guides.py --check
          python3 -m unittest discover -s leetcode-revision/tests -p 'test_*.py' -v
          node leetcode-revision/tests/dsa-renderer.test.cjs
      - name: Execute every DSA topic algorithm suite against published content
        run: python3 leetcode-revision/scripts/test-dsa-guides.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test iPhone, iPad and desktop plus local save and reload
        run: node leetcode-revision/tests/browser-smoke.mjs
      - name: Test all-topic UI and private-note preservation using synthetic storage
        run: node leetcode-revision/tests/dsa-browser.test.cjs
      - name: Test published guide content at phone, tablet and desktop viewports
        run: node leetcode-revision/tests/dsa-real-content.test.cjs
      - name: Test Extra notes across every DSA topic
        run: node leetcode-revision/tests/extra-notes-browser.test.cjs
      - name: Test private recovery controls on phone, tablet and desktop
        run: node leetcode-revision/tests/recovery-browser.test.cjs
